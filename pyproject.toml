[project]
name = "ga4_churn_predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "José Anselmo", email = "anselmojose297@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "db-dtypes>=1.7.1",
    "fastapi[standard]>=0.142.1",
    "google-cloud-bigquery>=3.45.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.2",
]

[project.scripts]
ga4_churn_predictor = "ga4_churn_predictor:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
